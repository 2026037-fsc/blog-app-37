<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>ブログページ</title>
</head>
<body>

    <header>
    <div class="logo">
    <h1>Spring</h1>
    </div>

    <div class="search-box">
        <input type="text" placeholder="キーワード検索">
    </div>

    <a href="/blog/new" class="post-button">投稿</a>
    </header>
<div class="main">
        <nav class="sidebar">
        <a href="/blogs">ホーム</a>
        <a href="/profile">プロフィール</a>
        </nav>

    <div class="container">
        <div class="content">
            <h1 th:text="${blog.title}">タイトル</h1>
            <p th:text="${blog.content}">ブログの内容</p>
        </div>
    </div>
</div>    
</body>
</html>
