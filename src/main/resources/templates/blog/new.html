<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>新規作成</title>
</head>
<body>

    <header>
    <div class="logo">
    <h1>Spring</h1>
    </div>

    <div class="search-box">
        <input type="text" placeholder="キーワード検索">
    </div>

    <a href="/blog/new" class="post-button">投稿</a>
    </header>
<div class="main">
    <nav class="sidebar">
        <a href="/blogs">ホーム</a>
        <a href="/profile">プロフィール</a>
    </nav>

<div class="container">
    <div class = "blogs-title"><h1>記事の新規作成</h1></div>
    <form th:action="@{/blogs}" th:object="${blogForm}" method="POST">
        <h3>タイトル</h3>
        <p><input type="text" th:field="*{title}" placeholder="ブログタイトル"></p>

        <h3>本文</h3>
        <p><textarea th:field=" *{content}" id="content" placeholder="記事内容"></textarea></p>
        <input type="submit" value="保存">
    </form>
</div>
</div>
</body>
</html>
